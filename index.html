<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xCasino - Live Gaming Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0e1217;
            --bg-card: #161b22;
            --accent-gold: #f3ba2f;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --text-main: #eaecef;
            --text-muted: #848e9c;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); margin: 0; padding: 10px; text-align: center; }
        
        /* الهيدر ورصيد الحساب */
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 10px 15px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 12px; }
        .balance-box { font-size: 16px; font-weight: bold; color: var(--accent-gold); }
        
        /* شريط الألعاب الأفقي (مثل 1xBet) */
        .games-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; scrollbar-width: none; }
        .games-nav::-webkit-scrollbar { display: none; }
        .game-tab { background: var(--bg-card); border: 1px solid #30363d; color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .game-tab.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--bg-card); border: 1px solid #30363d; border-radius: 16px; padding: 15px; margin-bottom: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        
        /* لوحة التحكم بالرهان */
        .bet-control { display: flex; gap: 10px; margin: 12px 0; align-items: center; justify-content: center; }
        .bet-input { background: #0b0e14; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 8px; width: 100px; text-align: center; font-size: 16px; font-weight: bold; }
        .bet-btn-quick { background: #21262d; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        
        button.action-btn { background: linear-gradient(135deg, #f3ba2f, #d49e1a); color: #000; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3); }
        button.action-btn:active { transform: scale(0.98); }

        /* شاشة العرض والألعاب الحية */
        .screen-box { background: #0b0e14; border: 2px solid #30363d; border-radius: 12px; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; position: relative; overflow: hidden; margin-bottom: 10px; }
        
        /* الطائرة (Aviator Style) */
        #aviator-plane { position: absolute; font-size: 40px; transition: 0.1s linear; left: 20px; bottom: 20px; }
        
        /* السلوتس الحقيقي */
        .slots-container { display: flex; justify-content: center; gap: 10px; font-size: 40px; }
        .slot-reel { background: #161b22; border: 1px solid #30363d; padding: 10px 20px; border-radius: 8px; min-width: 70px; }

        /* سجل النتائج والـ History */
        .history-bar { display: flex; gap: 5px; overflow-x: auto; margin-top: 10px; padding: 5px 0; }
        .history-item { background: #21262d; padding: 4px 8px; border-radius: 6px; font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="header">
        <div>🎲 <b>1xCasino Live</b></div>
        <div class="balance-box">💰 <span id="balance">1000.00</span> $</div>
    </div>

    <!-- شريط الألعاب -->
    <div class="games-nav">
        <button class="game-tab active" onclick="switchGame('aviator', event)">✈️ Aviator</button>
        <button class="game-tab" onclick="switchGame('slots', event)">🎰 777 Slots</button>
        <button class="game-tab" onclick="switchGame('roulette', event)">🎡 Roulette</button>
        <button class="game-tab" onclick="switchGame('mines', event)">💣 Mines</button>
    </div>

    <!-- 1. لعبة الطائرة (Aviator) -->
    <div id="aviator" class="section active">
        <div class="card">
            <div class="screen-box" id="aviator-screen">
                <div id="aviator-mult" style="color: var(--accent-green);">1.00x</div>
                <div id="aviator-plane">✈️</div>
            </div>
            <div class="bet-control">
                <span>الرهان:</span>
                <input type="number" id="aviator-bet" class="bet-input" value="10">
                <button class="bet-btn-quick" onclick="setBet('aviator-bet', 10)">10</button>
                <button class="bet-btn-quick" onclick="setBet('aviator-bet', 50)">50</button>
                <button class="bet-btn-quick" onclick="setBet('aviator-bet', 100)">100</button>
            </div>
            <button class="action-btn" id="aviator-btn" onclick="startAviator()">إقلاع الطائرة (رهان)</button>
        </div>
    </div>

    <!-- 2. السلوتس (Slots) -->
    <div id="slots" class="section">
        <div class="card">
            <div class="screen-box">
                <div class="slots-container">
                    <div class="slot-reel" id="r1">🍋</div>
                    <div class="slot-reel" id="r2">🍒</div>
                    <div class="slot-reel" id="r3">💎</div>
                </div>
            </div>
            <div class="bet-control">
                <span>الرهان:</span>
                <input type="number" id="slots-bet" class="bet-input" value="20">
            </div>
            <button class="action-btn" style="background:linear-gradient(135deg, #0ecb81, #069c61); color:#fff;" onclick="playSlots()">تدوير الحظ (Spin)</button>
        </div>
    </div>

    <!-- 3. الروليت (Roulette) -->
    <div id="roulette" class="section">
        <div class="card">
            <div class="screen-box" id="roulette-wheel" style="color: var(--accent-gold);">
                🎡 جاهز للتدوير
            </div>
            <div class="bet-control">
                <input type="number" id="roul-bet" class="bet-input" value="25">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="action-btn" style="background:var(--accent-red); color:#fff;" onclick="playRoulette('red')">رهان أحمر (x2)</button>
                <button class="action-btn" style="background:#21262d; color:#fff; border:1px solid #30363d;" onclick="playRoulette('black')">رهان أسود (x2)</button>
            </div>
        </div>
    </div>

    <!-- 4. المناجم (Mines) -->
    <div id="mines" class="section">
        <div class="card">
            <p style="font-size: 13px; color: var(--text-muted);">تجنب القنابل واجمع المضاعفات الحقيقية!</p>
            <div id="mines-grid" style="display:grid; grid-template-columns:repeat(5,1fr); gap:6px; max-width:280px; margin:10px auto;"></div>
            <button class="action-btn" onclick="resetMines()">إعادة تعيين المنجم</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e){}

        let balance = 1000.00;
        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2);
        }

        function switchGame(gameId, event) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(gameId).classList.add('active');
            event.target.classList.add('active');
        }

        function setBet(inputId, val) {
            document.getElementById(inputId).value = val;
        }

        // 1. منطق لعبة الطائرة الواقعية (Aviator)
        let aviatorInterval = null;
        function startAviator() {
            let bet = parseFloat(document.getElementById('aviator-bet').value);
            if (balance < bet) { alert("رصيد غير كافٍ!"); return; }
            balance -= bet;
            updateUI();

            let btn = document.getElementById('aviator-btn');
            btn.innerText = "سحب الأرباح (Cash Out)";
            btn.style.background = "var(--accent-green)";
            
            let mult = 1.00;
            let multBox = document.getElementById('aviator-mult');
            let plane = document.getElementById('aviator-plane');
            let crashPoint = (Math.random() * 3 + 1.1).toFixed(2); // نقطة الانهيار العشوائية

            let cashedOut = false;
            btn.onclick = function() {
                if (!cashedOut && mult < crashPoint) {
                    cashedOut = true;
                    let win = bet * mult;
                    balance += win;
                    updateUI();
                    alert(`✅ تم السحب بنجاح! ربحت: ${win.toFixed(2)}$`);
                    resetAviatorBtn();
                }
            };

            aviatorInterval = setInterval(() => {
                mult += 0.05;
                multBox.innerText = mult.toFixed(2) + "x";
                plane.style.left = Math.min(220, (mult * 40)) + "px";
                plane.style.bottom = Math.min(110, (mult * 25)) + "px";

                if (mult >= crashPoint && !cashedOut) {
                    clearInterval(aviatorInterval);
                    multBox.innerHTML = "<span style='color:var(--accent-red)'>طارت الطائرة! (Crash)</span>";
                    resetAviatorBtn();
                }
            }, 100);
        }

        function resetAviatorBtn() {
            clearInterval(aviatorInterval);
            let btn = document.getElementById('aviator-btn');
            btn.innerText = "إقلاع الطائرة (رهان)";
            btn.style.background = "var(--accent-gold)";
            btn.onclick = startAviator;
        }

        // 2. سلوتس كازينو حقيقي
        function playSlots() {
            let bet = parseFloat(document.getElementById('slots-bet').value);
            if (balance < bet) { alert("رصيد غير كافٍ!"); return; }
            balance -= bet;
            updateUI();

            let symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
            let r1 = symbols[Math.floor(Math.random()*symbols.length)];
            let r2 = symbols[Math.floor(Math.random()*symbols.length)];
            let r3 = symbols[Math.floor(Math.random()*symbols.length)];

            document.getElementById('r1').innerText = r1;
            document.getElementById('r2').innerText = r2;
            document.getElementById('r3').innerText = r3;

            if (r1 === r2 && r2 === r3) {
                let win = bet * 10;
                balance += win;
                updateUI();
                alert(`🎉 مبروك! مطابقة كبرى ربحت ${win}$`);
            }
        }

        // 3. روليت كازينو
        function playRoulette(color) {
            let bet = parseFloat(document.getElementById('roul-bet').value);
            if (balance < bet) { alert("رصيد غير كافٍ!"); return; }
            balance -= bet;
            updateUI();

            let wheel = document.getElementById('roulette-wheel');
            wheel.innerText = "🎡 تدور العجلة...";

            setTimeout(() => {
                let res = Math.random() > 0.5 ? 'red' : 'black';
                let resText = res === 'red' ? '🔴 أحمر' : '⚫ أسود';
                wheel.innerHTML = `النتيجة: ${resText}`;
                if (res === color) {
                    balance += (bet * 2);
                    updateUI();
                }
            }, 1000);
        }

        // 4. المناجم الاحترافية
        const minesGrid = document.getElementById('mines-grid');
        function resetMines() {
            minesGrid.innerHTML = '';
            for(let i=0; i<20; i++) {
                let cell = document.createElement('div');
                cell.className = 'slot-reel';
                cell.style.height = '42px';
                cell.style.fontSize = '16px';
                cell.style.display = 'flex';
                cell.style.alignItems = 'center';
                cell.style.justifyContent = 'center';
                cell.style.cursor = 'pointer';
                cell.innerText = '❓';
                cell.onclick = () => {
                    let isGem = Math.random() > 0.35;
                    cell.innerText = isGem ? '💎' : '💣';
                    cell.style.background = isGem ? '#065f46' : '#7f1d1d';
                    if(isGem) { balance += 5; updateUI(); }
                };
                minesGrid.appendChild(cell);
            }
        }
        resetMines();
    </script>
</body>
</html>
