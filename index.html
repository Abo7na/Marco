<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet Official Casino Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0f172a;
            --accent-orange: #ff6600;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --text-light: #f8fafc;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background: var(--bg-main); color: var(--text-light); margin: 0; padding: 8px; text-align: center; }

        /* الهيدر العلوي المطابق لـ 1xBet */
        .top-header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 10px 14px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 10px; }
        .balance-badge { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-weight: bold; color: var(--accent-orange); display: flex; align-items: center; gap: 6px; }
        .plus-btn { background: var(--accent-green); color: #fff; border: none; width: 22px; height: 22px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* شريط التنقل بين الألعاب */
        .nav-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
        .nav-bar::-webkit-scrollbar { display: none; }
        .nav-btn { background: var(--bg-card); border: 1px solid #1e293b; color: var(--text-muted); padding: 7px 14px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .nav-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); box-shadow: 0 0 10px rgba(37, 99, 235, 0.4); }

        .section { display: none; }
        .section.active { display: block; }

        .card { background: var(--bg-card); border: 1px solid #1e293b; border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

        /* لوحة أزرار الرهان السريع المطابقة */
        .bet-control-box { background: #0b1120; border: 1px solid #1e293b; border-radius: 12px; padding: 10px; margin-bottom: 8px; }
        .bet-input-row { display: flex; justify-content: space-between; align-items: center; background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; }
        .bet-input-row input { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: bold; width: 100px; text-align: left; outline: none; }
        .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
        .quick-num-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        .action-main-btn {
            background: linear-gradient(135deg, #ff6600, #e65c00);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
        }

        .game-screen {
            background: radial-gradient(circle at center, #1e1b4b 0%, #050811 85%);
            border: 2px solid #312e81;
            border-radius: 12px;
            height: 180px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* جدول الرهانات الحية أسفل الطائرة */
        .live-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; text-align: right; }
        .live-table th { color: var(--text-muted); padding: 4px; border-bottom: 1px solid #1e293b; font-weight: normal; }
        .live-table td { padding: 6px 4px; border-bottom: 1px solid #0b1120; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="top-header">
        <div style="font-size: 13px; font-weight: bold; color: #94a3b8;">⚡ 1xBet Casino</div>
        <div class="balance-badge">
            <button class="plus-btn" onclick="addBalance()">+</button>
            <span id="balance">0.00</span> $
        </div>
    </div>

    <!-- شريط الألعاب -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchGame('crash', event)">✈️ الطائرة (Crash)</button>
        <button class="nav-btn" onclick="switchGame('wheel', event)">🎡 عجلة الحظ</button>
        <button class="nav-btn" onclick="switchGame('slots', event)">🎰 سابت سلوتس</button>
        <button class="nav-btn" onclick="switchGame('gems', event)">💎 مناجم الجواهر</button>
    </div>

    <!-- 1. لعبة الطائرة (Crash) مع لوحة الرهانات المطابقة تماماً للصورة -->
    <div id="crash" class="section active">
        <div class="card" style="padding: 8px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                <button style="background:#ff6600; border:none; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:bold;">📋 السجل</button>
                <button style="background:transparent; border:1px solid #ff6600; color:#ff6600; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:bold;">الأحكام والشروط</button>
            </div>
            <div class="game-screen" style="height: 160px;">
                <canvas id="crashCanvas" width="320" height="160" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>
                <div id="multText" style="font-size: 38px; font-weight:900; color:#fff; z-index:2; text-shadow:0 0 12px rgba(255,255,255,0.4);">1.00x</div>
            </div>

            <!-- لوحة الرهان الأولى -->
            <div class="bet-control-box">
                <div class="bet-input-row">
                    <button style="background:transparent; border:none; color:#ef4444; font-size:16px; font-weight:bold; cursor:pointer;" onclick="setBet('bet-crash1', 0)">✖</button>
                    <input type="number" id="bet-crash1" value="0.1">
                </div>
                <div class="quick-grid">
                    <button class="quick-num-btn" onclick="setBet('bet-crash1', 1)">1</button>
                    <button class="quick-num-btn" onclick="setBet('bet-crash1', 2)">2</button>
                    <button class="quick-num-btn" onclick="setBet('bet-crash1', 5)">5</button>
                    <button class="quick-num-btn" onclick="setBet('bet-crash1', 10)">10</button>
                    <button class="quick-num-btn" onclick="setBet('bet-crash1', 50)">50</button>
                    <button class="quick-num-btn" onclick="setBet('bet-crash1', 100)">100</button>
                </div>
                <button class="action-main-btn" id="crashBtn" onclick="toggleCrash()">وضع الرهان (على الجولة التالية)</button>
            </div>

            <!-- إحصائيات الرهانات الحية والمستخدمين -->
            <div style="display:flex; justify-content:space-around; background:#0b1120; padding:8px; border-radius:8px; margin-top:8px; font-size:11px;">
                <div>عدد الرهانات<br><b style="color:var(--accent-orange)">168 👤</b></div>
                <div>مجموع الرهانات<br><b style="color:#fff">190.08 $</b></div>
                <div>مجموع الربح<br><b style="color:var(--accent-green)">0 USD</b></div>
            </div>

            <table class="live-table">
                <tr>
                    <th>اسم المستخدم</th>
                    <th>الفرص</th>
                    <th>الرهان</th>
                    <th>الأرباح</th>
                </tr>
                <tr>
                    <td>09******</td>
                    <td>x0</td>
                    <td>USD 15.3</td>
                    <td>USD 0</td>
                </tr>
                <tr>
                    <td>09******</td>
                    <td>x0</td>
                    <td>USD 6.19</td>
                    <td>USD 0</td>
                </tr>
                <tr>
                    <td>39******</td>
                    <td>x0</td>
                    <td>USD 3.61</td>
                    <td>USD 0</td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 2. عجلة الحظ (Lucky Wheel) -->
    <div id="wheel" class="section">
        <div class="card">
            <div style="font-size:13px; font-weight:bold; color:var(--accent-orange); margin-bottom:6px;">LUCKY WHEEL</div>
            <div class="game-screen" style="height:220px; background:radial-gradient(circle at center, #1e1b4b 0%, #04060d 90%);">
                <div id="wheelObj" style="font-size: 90px; transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1);">🎡</div>
                <div id="wheelResult" style="font-size: 13px; color: var(--accent-orange); font-weight:bold; margin-top:4px;">اضغط للتدوير بربح مضمون</div>
            </div>
            <button class="action-main-btn" onclick="spinWheel()">قم بالتدوير مقابل 1 يورو</button>
        </div>
    </div>

    <!-- 3. سلوتس (Respin Slot) -->
    <div id="slots" class="section">
        <div class="card">
            <div style="font-size:14px; font-weight:bold; color:#ec4899; margin-bottom:6px;">✨ RESPIN SLOT ✨</div>
            <div class="game-screen" style="background: radial-gradient(circle at center, #581c87 0%, #09090b 90%); border-color:#7e22ce;">
                <div style="display:flex; gap:8px; font-size:32px;">
                    <div style="background:#18181b; border:2px solid #a855f7; padding:8px 14px; border-radius:8px;" id="sl1">💎</div>
                    <div style="background:#18181b; border:2px solid #a855f7; padding:8px 14px; border-radius:8px;" id="sl2">🍒</div>
                    <div style="background:#18181b; border:2px solid #a855f7; padding:8px 14px; border-radius:8px;" id="sl3">⭐</div>
                    <div style="background:#18181b; border:2px solid #a855f7; padding:8px 14px; border-radius:8px;" id="sl4">🍋</div>
                </div>
            </div>
            <div class="bet-control-box">
                <div class="bet-input-row">
                    <input type="number" id="bet-slots" value="0.04" style="width:100%;">
                </div>
                <button class="action-main-btn" style="background:linear-gradient(135deg, #9333ea, #7e22ce);" onclick="playSlots()">تشغيل الماكينة (PLAY)</button>
            </div>
        </div>
    </div>

    <!-- 4. مناجم الجواهر (Gems Odyssey) -->
    <div id="gems" class="section">
        <div class="card">
            <div style="font-size:13px; font-weight:bold; color:var(--accent-blue); margin-bottom:6px;">GEMS ODYSSEY</div>
            <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; max-width:280px; margin:0 auto 10px auto;" id="gemsGrid"></div>
            <div class="bet-control-box">
                <div class="bet-input-row">
                    <input type="number" id="bet-gems" value="0.05" style="width:100%;">
                </div>
                <button class="action-main-btn" style="background:linear-gradient(135deg, #2563eb, #1d4ed8);" onclick="initGems()">بدء الرهان وفتح الجواهر</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e){}

        let balance = 10.00;
        function updateUI() { document.getElementById('balance').innerText = balance.toFixed(2); }
        updateUI();

        function addBalance() {
            balance += 50.00;
            updateUI();
            haptic('heavy');
        }

        function haptic(type = 'medium') {
            try { if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type); } catch(e){}
        }

        function switchGame(id, e) {
            haptic('light');
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            e.target.classList.add('active');
        }

        function setBet(id, val) { document.getElementById(id).value = val; }

        /* --- لعبة الطائرة --- */
        const canvas = document.getElementById('crashCanvas');
        const ctx = canvas.getContext('2d');
        let crashInterval = null, isFlying = false, mult = 1.00, crashAt = 1.00, currentBet = 0, points = [];

        function drawCrashPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (points.length < 2) return;
            ctx.strokeStyle = '#ff6600';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
            let last = points[points.length - 1];
            ctx.font = "22px Arial";
            ctx.fillText("✈️", last.x, last.y - 10);
        }

        function toggleCrash() {
            let btn = document.getElementById('crashBtn');
            if (!isFlying) {
                currentBet = parseFloat(document.getElementById('bet-crash1').value);
                if (balance < currentBet) { alert("رصيد غير كافٍ!"); return; }
                balance -= currentBet;
                updateUI();
                haptic('heavy');

                isFlying = true;
                mult = 1.00;
                points = [{x: 20, y: 140}];
                crashAt = (Math.random() * 2.5 + 1.15).toFixed(2);

                btn.innerText = "سحب الأرباح (CASH OUT)";
                btn.style.background = "linear-gradient(135deg, #10b981, #059669)";

                let step = 0;
                crashInterval = setInterval(() => {
                    mult += 0.03;
                    step += 0.05;
                    document.getElementById('multText').innerText = mult.toFixed(2) + "x";
                    points.push({x: Math.min(290, 20 + step * 35), y: Math.max(20, 140 - Math.pow(step, 1.2) * 20)});
                    drawCrashPath();

                    if (mult >= crashAt) endCrash(false);
                }, 90);
            } else {
                let win = currentBet * mult;
                balance += win;
                updateUI();
                haptic('heavy');
                endCrash(true, win);
            }
        }

        function endCrash(success, winAmount = 0) {
            clearInterval(crashInterval);
            isFlying = false;
            let btn = document.getElementById('crashBtn');
            if (!success) {
                document.getElementById('multText').innerHTML = "<span style='color:#ef4444'>CRASHED!</span>";
                haptic('heavy');
            } else {
                alert(`مبروك! ربحت ${winAmount.toFixed(2)}$`);
            }
            btn.innerText = "وضع الرهان (على الجولة التالية)";
            btn.style.background = "linear-gradient(135deg, #ff6600, #e65c00)";
        }

        /* --- عجلة الحظ --- */
        function spinWheel() {
            if (balance < 1) { alert("رصيد غير كافٍ!"); return; }
            balance -= 1;
            updateUI();
            haptic('med');
            let wheel = document.getElementById('wheelObj');
            let deg = Math.floor(Math.random() * 360) + 1440;
            wheel.style.transform = `rotate(${deg}deg)`;
            setTimeout(() => {
                let win = (Math.random() * 5).toFixed(2);
                balance += parseFloat(win);
                updateUI();
                document.getElementById('wheelResult').innerText = `🎉 ربحت جائزة بقيمة ${win}$!`;
                haptic('heavy');
            }, 3000);
        }

        /* --- سلوتس Respin --- */
        function playSlots() {
            let bet = parseFloat(document.getElementById('bet-slots').value);
            if (balance < bet) { alert("رصيد غير كافٍ!"); return; }
            balance -= bet;
            updateUI();
            haptic('med');
            let s = ['💎', '🍒', '⭐', '🍋', '7️⃣', '🔔'];
            let r1 = s[Math.floor(Math.random()*s.length)];
            let r2 = s[Math.floor(Math.random()*s.length)];
            let r3 = s[Math.floor(Math.random()*s.length)];
            let r4 = s[Math.floor(Math.random()*s.length)];
            document.getElementById('sl1').innerText = r1;
            document.getElementById('sl2').innerText = r2;
            document.getElementById('sl3').innerText = r3;
            document.getElementById('sl4').innerText = r4;
            if(r1 === r2 && r2 === r3) {
                balance += bet * 15;
                updateUI();
                haptic('heavy');
                alert("✨ ربح مذهل في السلوتس!");
            }
        }

        /* --- مناجم الجواهر --- */
        const gemsGrid = document.getElementById('gemsGrid');
        function initGems() {
            let bet = parseFloat(document.getElementById('bet-gems').value);
            if (balance < bet) { alert("رصيد غير كافٍ!"); return; }
            balance -= bet;
            updateUI();
            haptic('med');
            gemsGrid.innerHTML = '';
            for(let i=0; i<30; i++) {
                let cell = document.createElement('div');
                cell.style.background = '#1e293b';
                cell.style.height = '35px';
                cell.style.borderRadius = '6px';
                cell.style.display = 'flex';
                cell.style.alignItems = 'center';
                cell.style.justifyContent = 'center';
                cell.style.fontSize = '15px';
                cell.style.cursor = 'pointer';
                cell.innerText = '💎';
                cell.onclick = () => {
                    haptic('light');
                    let prize = bet * (Math.random() < 0.3 ? 3 : 0.5);
                    balance += prize;
                    updateUI();
                    cell.style.background = '#065f46';
                    cell.innerText = '⭐';
                };
                gemsGrid.appendChild(cell);
            }
        }
        initGems();
    </script>
</body>
</html>
