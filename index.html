<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SultanStakes - Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0c0814; color: #fff; font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .airplane-box { background: #181226; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #33274d; }
        #multiplier { font-size: 45px; font-weight: bold; color: #f3ba2f; margin: 15px 0; }
        .btn { background: linear-gradient(135deg, #f3ba2f, #d49a15); color: #000; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
        .input-box { background: #241c3a; border: 1px solid #4a3b75; color: #fff; padding: 10px; width: 80%; border-radius: 8px; font-size: 16px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="airplane-box">
        <h2>✈️ SultanStakes Crash</h2>
        <div id="multiplier">1.00x</div>
        <p id="status">انتظار بدء الجولة...</p>
        
        <div>
            <label>قيمة الرهان (USD):</label><br>
            <input type="number" id="betAmount" class="input-box" value="1.0" min="0.1" step="0.1">
        </div>
        
        <button class="btn" onclick="placeBet()">وضع الرهان</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function placeBet() {
            let betVal = document.getElementById('betAmount').value;
            let data = {
                action: "place_bet",
                bet: parseFloat(betVal)
            };
            // إرسال البيانات مباشرة إلى البوت عبر Telegram WebApp API
            tg.sendData(JSON.stringify(data));
            alert("✅ تم إرسال الرهان إلى البوت بنجاح!");
        }
    </script>
</body>
</html>
