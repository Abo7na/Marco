<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet Crash Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #070913;
            --bg-card: #0f172a;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background: var(--bg-main); color: var(--text-light); margin: 0; padding: 10px; text-align: center; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 12px 18px; border-radius: 14px; border: 1px solid #1e293b; margin-bottom: 12px; }
        .balance { font-size: 18px; font-weight: bold; color: var(--accent-gold); }

        .card { background: var(--bg-card); border: 1px solid #1e293b; border-radius: 16px; padding: 15px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

        /* شاشة لعبة Crash المماثلة تماماً للثيم العالمي */
        .crash-screen {
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 80%);
            border: 2px solid #312e81;
            border-radius: 16px;
            height: 220px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .multiplier-text {
            font-size: 45px;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
            z-index: 2;
        }

        .sub-text { font-size: 13px; color: #94a3b8; z-index: 2; margin-top: 5px; }

        .bet-control { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 12px 0; }
        .bet-input { background: #020617; border: 1px solid #1e293b; color: #fff; padding: 12px; border-radius: 12px; width: 120px; text-align: center; font-size: 18px; font-weight: bold; }
        .quick-btn { background: #1e293b; border: none; color: #cbd5e1; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .action-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            transition: 0.1s;
        }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <div>✈️ <b>1xBet Crash</b></div>
        <div class="balance">💰 <span id="balance">1000.00</span> $</div>
    </div>

    <div class="card">
        <!-- شاشة اللعبة الحية -->
        <div class="crash-screen" id="screenBox">
            <!-- خلفية الـ Canvas لرسم مسار الطائرة الذهبي المضيء -->
            <canvas id="crashCanvas" width="340" height="220" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>
            
            <div class="multiplier-text" id="multText">1.00x</div>
            <div class="sub-text" id="statusText">اضغط رهـان لبدء الطيران</div>
        </div>

        <div class="bet-control">
            <span>الرهان:</span>
            <input type="number" id="betInput" class="bet-input" value="20">
            <button class="quick-btn" onclick="setVal(20)">20</button>
            <button class="quick-btn" onclick="setVal(50)">50</button>
            <button class="quick-btn" onclick="setVal(100)">100</button>
        </div>

        <button class="action-btn" id="mainBtn" onclick="handleGameAction()">رهان (PLACE BET)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e){}

        let balance = 1000.00;
        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2);
        }

        function haptic(type = 'medium') {
            try {
                if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
            } catch(e){}
        }

        function setVal(val) { document.getElementById('betInput').value = val; }

        const canvas = document.getElementById('crashCanvas');
        const ctx = canvas.getContext('2d');
        let gameInterval = null;
        let isPlaying = false;
        let currentMult = 1.00;
        let crashPoint = 1.00;
        let currentBet = 0;
        let pathPoints = [];

        function drawScene(progress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (pathPoints.length < 2) return;

            // رسم مسار الإقلاع الذهبي المضيء (مثل المنحنى الموجود في الصورة)
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#fbbf24";
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
            for (let i = 1; i < pathPoints.length; i++) {
                ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // رسم الطائرة الذهبية في أحدث نقطة للمسار
            let last = pathPoints[pathPoints.length - 1];
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("✈️", last.x, last.y - 15);
        }

        function handleGameAction() {
            let btn = document.getElementById('mainBtn');

            if (!isPlaying) {
                currentBet = parseFloat(document.getElementById('betInput').value);
                if (balance < currentBet) { alert("رصيد غير كافٍ!"); return; }
                balance -= currentBet;
                updateUI();
                haptic('heavy');

                isPlaying = true;
                currentMult = 1.00;
                pathPoints = [{x: 30, y: 190}];
                
                // محرك House Edge دقيق يضمن تفوق المنصة
                let r = Math.random();
                if (r < 0.55) crashPoint = (Math.random() * 0.3 + 1.05).toFixed(2); // سقوط سريع
                else if (r < 0.85) crashPoint = (Math.random() * 1.8 + 1.35).toFixed(2); // صعود متوسط
                else crashPoint = (Math.random() * 6.0 + 3.2).toFixed(2); // ارتفاع كبيير نادر

                btn.innerText = "سحب الأرباح (CASH OUT)";
                btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                btn.style.color = "#fff";
                document.getElementById('statusText').innerText = "الطائرة تحلق الآن...";

                let step = 0;
                gameInterval = setInterval(() => {
                    currentMult += 0.04;
                    step += 0.05;
                    
                    document.getElementById('multText').innerText = currentMult.toFixed(2) + "x";

                    // حساب إحداثيات منحنى الطيران لتشابه المنصة الكبرى
                    let px = Math.min(300, 30 + (step * 45));
                    let py = Math.max(30, 190 - (Math.pow(step, 1.3) * 30));
                    pathPoints.push({x: px, y: py});

                    drawScene();

                    if (currentMult >= crashPoint) {
                        endGame(false);
                    }
                }, 90);

            } else {
                // عملية السحب الناجحة (Cash Out)
                let win = currentBet * currentMult;
                balance += win;
                updateUI();
                haptic('heavy');
                endGame(true, win);
            }
        }

        function endGame(success, winAmount = 0) {
            clearInterval(gameInterval);
            isPlaying = false;
            let btn = document.getElementById('mainBtn');
            let status = document.getElementById('statusText');

            if (!success) {
                document.getElementById('multText').innerHTML = "<span style='color:var(--accent-red)'>CRASHED!</span>";
                status.innerText = "طارت الطائرة، خسرت الرهان!";
                haptic('heavy');
            } else {
                status.innerHTML = `<span style="color:var(--accent-green)">تم السحب بنجاح! ربحت ${winAmount.toFixed(2)}$</span>`;
            }

            btn.innerText = "رهان (PLACE BET)";
            btn.style.background = "linear-gradient(135deg, #f59e0b, #d97706)";
            btn.style.color = "#000";
        }
    </script>
</body>
</html>
